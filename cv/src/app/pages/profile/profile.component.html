<header-bar
  [saludo]="saludo"
  [theme]="theme"
  (toggleTheme)="toggleTheme()"
  (print)="print()">
</header-bar>

<main>
  <presentacion></presentacion>

  <!-- Educación inline -->
  <educacion></educacion>

  <!-- Skills desde DataService -->
  <section class="skills-section">
    <h2>Skills</h2>
    <div class="skills-list">
      <span class="skill-pill" *ngFor="let skill of skills">{{ skill }}</span>
    </div>
  </section>

  <!-- Jobs desde DataService -->
  <section class="jobs-section">
    <h2>Jobs</h2>
    <div class="skills-list">
      <span class="skill-pill job-pill" *ngFor="let job of jobs">{{ job }}</span>
    </div>
  </section>

  <!-- Experiencia ya no se renderiza aquí, vive en /experience -->
  <!-- <experiencia></experiencia> -->

  <tecnologias></tecnologias>
  <lenguajes></lenguajes>
  <softskills></softskills>

  <proyectos></proyectos>
  <certificaciones></certificaciones>

  <generic-blocks></generic-blocks>

  <links-block></links-block>
  <extras-block></extras-block>
</main>

<footer-bar [year]="year"></footer-bar>
