<section class="container" id="proyectos">
  <h2 class="mb-3">Proyecto destacado</h2>

  <div *ngIf="loading()">Cargando proyecto…</div>
  <div *ngIf="!loading() && error()" class="error">{{ error() }}</div>

  <div *ngIf="!loading() && repo() as r">
    <h3 class="repo-title">
      <a [href]="r.html_url + '/tree/TareaCV'" target="_blank" rel="noopener noreferrer">
        {{ r.name }}
      </a>
    </h3>
    <p class="repo-desc">
      {{ r.description || 'Sin descripción disponible' }}
    </p>
  </div>
</section>
